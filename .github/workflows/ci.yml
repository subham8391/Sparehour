name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run --coverage
      - run: npm run build
      # Bundle budgets (SYSTEM_DESIGN.md §11.6): the gzipped shell of each prerendered route.
      - run: npm run size

  # Database contract tests (SYSTEM_DESIGN.md §12.2): RLS, apply_mutations,
  # triggers — run against a real local Supabase, migrations + seed applied.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,mailpit
      - run: npx vitest run src/server/db
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          CONTRACT_TESTS: required

  # End-to-end (SYSTEM_DESIGN.md §12.2): the production build against the real
  # local stack — Supabase, self-hosted PowerSync — signed in as the seeded
  # dev account. Playwright drives Chromium on desktop and a phone profile.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,mailpit
      - name: Write .env.local from the local stack
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nNEXT_PUBLIC_POWERSYNC_URL=/powersync\nPOWERSYNC_INTERNAL_URL=http://localhost:8080\nNEXT_PUBLIC_APP_URL=http://localhost:3100\nPOWERSYNC_JWT_SECRET=sparehour-local-sync-token-secret-0123456789abcdef\n' \
            "$API_URL" "$ANON_KEY" "$SERVICE_ROLE_KEY" > .env.local
      - name: Start PowerSync against the local Postgres
        run: |
          docker exec supabase_db_Sparehour psql -U postgres -d postgres -Atc "create database powersync_storage"
          docker compose -f powersync/docker-compose.yml up -d
          for i in $(seq 1 40); do curl -fs http://localhost:8080/probes/liveness >/dev/null && exit 0; sleep 3; done
          docker compose -f powersync/docker-compose.yml logs; exit 1
      - run: npm run build
      - run: npx playwright test
        env:
          CI: "1"
          E2E_SKIP_BUILD: "1"
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
