# Self-hosted PowerSync for local development, replicating from the local
# Supabase Postgres (supabase start → port 54322). Start with `npm run dev:stack`.
services:
  powersync:
    image: journeyapps/powersync-service:latest
    command: ["start", "-r", "unified"]
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      NODE_OPTIONS: --max-old-space-size=1000
    volumes:
      - ./config:/config
      - ../supabase/powersync:/streams:ro
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped
