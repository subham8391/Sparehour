# PowerSync service config — local development only.
# Source: the local Supabase Postgres. Bucket storage: a separate database on
# the same local Postgres (created by scripts/dev-stack.sh).
replication:
  connections:
    - type: postgresql
      uri: postgresql://powersync_role:powersync_local@host.docker.internal:54322/postgres
      sslmode: disable

storage:
  type: postgresql
  uri: postgresql://postgres:postgres@host.docker.internal:54322/powersync_storage
  sslmode: disable

sync_config:
  path: /streams/streams.yaml

# Client auth (SYSTEM_DESIGN.md §9.2): the app mints a five-minute HS256 token
# at /api/sync/token with `sub` = user id and `aud` = "powersync"; the service
# verifies it with the same secret, given here as a JWK (`k` is the secret,
# base64url). PS_SYNC_JWT_K comes from docker-compose.yml, which defaults it
# to the local development secret; a real deployment sets both sides itself.
# The Supabase session is never presented to the service.
client_auth:
  jwks:
    keys:
      - kty: oct
        alg: HS256
        kid: sparehour-sync-v1
        k: !env PS_SYNC_JWT_K
  audience: ["powersync"]

api:
  tokens:
    - local-dev-api-token

port: 8080

telemetry:
  disable_telemetry_sharing: true

system:
  logging:
    level: info
    format: text
