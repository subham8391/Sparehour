<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Instrument+Sans:wght@400;500;600&amp;family=DM+Mono:wght@400;500&amp;display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#F4F8F6}
    a{color:#1C7B5A}a:hover{color:#161C19}
    .root{font-family:'Instrument Sans','Helvetica Neue',Helvetica,Arial,sans-serif;color:#161C19;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
    .serif{font-family:'Instrument Serif','Iowan Old Style',Georgia,serif;font-weight:400;letter-spacing:-0.01em}
    .mono{font-family:'DM Mono','SF Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
    .label{font-size:11.5px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#89928D}
    .card{background:#FFFFFF;border:1px solid #D9E0DD;border-radius:14px;overflow:hidden}
    .it{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border-top:1px solid #D9E0DD;font-size:15px}
    .it.first{border-top:0}
    .it.sub{padding-left:44px;font-size:14.5px;color:#5C6661}
    .it svg.ic{width:20px;height:20px;color:#5C6661;flex:none}
    .it .n{margin-left:auto;font-family:'DM Mono','SF Mono',Menlo,monospace;font-size:12px;color:#89928D}
    .it .dot{width:6px;height:6px;border-radius:50%;background:#BEC6C2;flex:none;margin:0 7px}
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:500;color:#89928D;position:relative}
    .tab.active{color:#161C19}
    .tab svg{width:22px;height:22px}
    .tab .badge{position:absolute;top:-4px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#161C19;color:#F4F8F6;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center}
  </style>
</helmet>
<div class="root" style="width:390px;height:844px;background:#F4F8F6;overflow:hidden;position:relative;display:flex;flex-direction:column">
  <div style="height:54px;flex:none"></div>
  <div style="display:flex;flex-direction:column;gap:14px;padding:0 20px">
    <span class="serif" style="font-size:28px;line-height:1.05">Browse</span>
    <div style="display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:12px;background:#FFFFFF;border:1px solid #D9E0DD;color:#89928D;font-size:15px">
      <svg viewBox="0 0 20 20" style="width:18px;height:18px" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"></circle><path d="M13.2 13.2L17 17"></path></svg>
      <span>Search tasks, projects, commands</span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;padding:16px 20px 0;flex:1;min-height:0;overflow:hidden">
    <div style="display:flex;flex-direction:column;gap:8px">
      <span class="label" style="padding:0 2px">Areas</span>
      <div class="card">
        <div class="it first"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 5 5-5"></path></svg><span style="font-weight:500">Work</span><span class="n">3 projects</span></div>
        <div class="it sub"><span class="dot"></span><span>Acme</span><span class="n">5</span></div>
        <div class="it sub"><span class="dot"></span><span>Website</span><span class="n">4</span></div>
        <div class="it sub"><span class="dot"></span><span>Platform</span><span class="n">6</span></div>
        <div class="it"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l5 5-5 5"></path></svg><span style="font-weight:500">Personal</span><span class="n">7</span></div>
        <div class="it"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l5 5-5 5"></path></svg><span style="font-weight:500">Health</span><span class="n">2</span></div>
      </div>
    </div>
    <div class="card">
      <div class="it first"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 0 1 10.2-4.2L16 7.5"></path><path d="M16 3.5v4h-4"></path><path d="M16 10a6 6 0 0 1-10.2 4.2L4 12.5"></path><path d="M4 16.5v-4h4"></path></svg><span>Routines</span><span class="n">1 scheduled</span></div>
      <div class="it"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 12.2A6 6 0 0 1 7.8 4.5a6 6 0 1 0 7.7 7.7z"></path></svg><span>Someday</span><span class="n">12</span></div>
      <div class="it"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H16v13H5.5A1.5 1.5 0 0 0 4 17.5z"></path><path d="M4 17.5V4.5M8 7h5"></path></svg><span>Logbook</span><span class="n">23 this week</span></div>
      <div class="it"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h8a4 4 0 0 1 0 8H9"></path><path d="M11 11l-2 3 2 3"></path></svg><span>Carried over</span><span class="n">3</span></div>
    </div>
    <div class="card">
      <div class="it first"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h12"></path><circle cx="8" cy="6" r="1.6" fill="#FFFFFF"></circle><circle cx="13" cy="10" r="1.6" fill="#FFFFFF"></circle><circle cx="7" cy="14" r="1.6" fill="#FFFFFF"></circle></svg><span>Settings</span></div>    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:88px;padding:10px 12px 0;background:rgba(244,248,246,0.94);border-top:1px solid #D9E0DD;display:flex;align-items:flex-start">
    <div class="tab"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="3.2"></circle><path d="M10 3v1.6M10 15.4V17M3 10h1.6M15.4 10H17M5.05 5.05l1.13 1.13M13.82 13.82l1.13 1.13M5.05 14.95l1.13-1.13M13.82 6.18l1.13-1.13"></path></svg><span>Today</span></div>
    <div class="tab"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5V15a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 17 15v-3.5"></path><path d="M3 11.5l2-6.5h10l2 6.5"></path><path d="M3 11.5h4l1.2 2h3.6l1.2-2h4"></path></svg><span>Inbox</span><span class="badge">3</span></div>
    <div class="tab"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="4.5" width="13" height="12" rx="2"></rect><path d="M3.5 8.5h13M7 3v3M13 3v3"></path></svg><span>Week</span></div>
    <div class="tab active"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="3" width="6" height="6" rx="1.5"></rect><rect x="11" y="3" width="6" height="6" rx="1.5"></rect><rect x="3" y="11" width="6" height="6" rx="1.5"></rect><rect x="11" y="11" width="6" height="6" rx="1.5"></rect></svg><span>Browse</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
