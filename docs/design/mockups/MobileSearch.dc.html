<!doctype html>
<html>
<head>

<body>
<x-dc>
<helmet>

  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#F4F8F6}
    a{color:#1C7B5A}a:hover{color:#161C19}
    .root{font-family:'Instrument Sans','Helvetica Neue',Helvetica,Arial,sans-serif;color:#161C19;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
    .serif{font-family:'Instrument Serif','Iowan Old Style',Georgia,serif;font-weight:400;letter-spacing:-0.01em}
    .mono{font-family:'DM Mono','SF Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
    .label{font-size:11.5px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#89928D}
    .res{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 4px;font-size:15px}
    .res svg.ic{width:20px;height:20px;color:#5C6661;flex:none}
    .res .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .res .t b{font-weight:600;background:#EDF1EF;border-radius:3px;padding:0 1px}
    .res .m{font-size:12px;color:#89928D;white-space:nowrap}
    .chip{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:5px;background:#EDF1EF;color:#5C6661;font-size:11.5px;white-space:nowrap;font-family:'DM Mono','SF Mono',Menlo,monospace}
  </style>
</helmet>
<div class="root" style="width:390px;height:844px;background:#F4F8F6;overflow:hidden;position:relative">

  </div>
  <div style="position:absolute;inset:0;background:rgba(22,28,25,0.42)"></div>

  <div style="position:absolute;left:0;right:0;top:54px;height:496px;background:#FFFFFF;border-radius:0 0 20px 20px;box-shadow:0 12px 40px rgba(22,28,25,0.18);display:flex;flex-direction:column;padding:10px 16px 12px;gap:8px">
    <div style="display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:12px;border:1.5px solid #161C19;background:#F4F8F6;font-size:17px">
      <svg viewBox="0 0 20 20" style="width:18px;height:18px;color:#5C6661" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"></circle><path d="M13.2 13.2L17 17"></path></svg>

    </div>
    <span class="label" style="padding:8px 4px 0">Commands</span>

    <div class="res"><svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 4v12M4 10h12"></path></svg><span class="t">New task in <b>Acme</b></span><span class="m">command</span></div>
    <span class="label" style="padding:8px 4px 0">Tasks</span>
    <div class="res"><span style="width:20px;height:20px;border-radius:50%;border:1.5px solid #BEC6C2;flex:none"></span><span class="t">Write proposal for <b>Acme</b> renewal</span><span class="chip">Today</span></div>
    <div class="res"><span style="width:20px;height:20px;border-radius:50%;border:1.5px solid #BEC6C2;flex:none"></span><span class="t"><b>Acme</b> renewal deck</span><span class="chip">Thu</span></div>
    <div class="res"><span style="width:20px;height:20px;border-radius:50%;border:1.5px solid #BEC6C2;flex:none"></span><span class="t">Send <b>Acme</b> proposal</span><span class="chip">Fri</span></div>
